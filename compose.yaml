services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: waste_hub
      POSTGRES_USER: waste
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD before starting Docker Compose}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waste -d waste_hub"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
