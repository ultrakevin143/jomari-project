name: Local verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waste_test
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: waste_hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waste_test -d waste_hub_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://waste_test:ci-local-only@127.0.0.1:5432/waste_hub_test
      DIRECT_URL: postgresql://waste_test:ci-local-only@127.0.0.1:5432/waste_hub_test
      TEST_DATABASE_URL: postgresql://waste_test:ci-local-only@127.0.0.1:5432/waste_hub_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run check:architecture
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
